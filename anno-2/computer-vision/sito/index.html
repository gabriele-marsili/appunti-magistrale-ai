<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Computer Vision · Appunti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#1C2630; --muted:#5B6773; --line:#DCE1E6;
  --slate:#243238; --accent:#B8581A; --accent-soft:#FBEFE5;
  --warn:#A3261E; --warn-soft:#FBEAE8; --extra:#2F5E7A; --extra-soft:#E8F1F6;
  --code:#EEF1F4; --book:#3D6B3A; --book-soft:#EAF2E6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141A1F; --surface:#1C242B; --ink:#E4E9ED; --muted:#9AA7B2; --line:#2E3A44;
    --slate:#0F1519; --accent:#E8904F; --accent-soft:#3A2A1E;
    --warn:#F08A80; --warn-soft:#3B2220; --extra:#8CC2E0; --extra-soft:#1D2F3A;
    --code:#252F37; --book:#9BCB8F; --book-soft:#1F2E22;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141A1F; --surface:#1C242B; --ink:#E4E9ED; --muted:#9AA7B2; --line:#2E3A44;
  --slate:#0F1519; --accent:#E8904F; --accent-soft:#3A2A1E;
  --warn:#F08A80; --warn-soft:#3B2220; --extra:#8CC2E0; --extra-soft:#1D2F3A;
  --code:#252F37; --book:#9BCB8F; --book-soft:#1F2E22;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15.5px/1.6 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;text-wrap:balance;line-height:1.25;margin:0}
code,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:.9em}
code{background:var(--code);padding:1px 5px;border-radius:4px}
pre{background:var(--code);padding:14px 16px;border-radius:8px;overflow-x:auto;font:13px/1.55 "IBM Plex Mono",ui-monospace,monospace;margin:0}
a{color:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--slate);color:#E9EEF1;margin-inline:-16px;padding:10px 16px}
.top .wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.top strong{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:17px}
.top nav{display:flex;gap:4px;flex-wrap:wrap}
.top nav a{color:#C9D3DA;text-decoration:none;font-size:13.5px;padding:4px 10px;border-radius:6px}
.top nav a:hover,.top nav a:focus-visible{background:#35464E;color:#fff;outline:none}
header.hero{padding-block:36px 8px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
header.hero h1{font-size:clamp(28px,4.4vw,42px);margin-top:6px}
header.hero p{color:var(--muted);max-width:68ch;margin:10px 0 0}
.howto{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.howto h2{font-size:18px;grid-column:1/-1}
.howto div{display:grid;gap:4px;align-content:start}
.howto b{font-weight:600}
.howto p{margin:0;color:var(--muted);font-size:14.5px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:1px 8px;border-radius:999px;vertical-align:1px}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.tag.x{background:var(--extra-soft);color:var(--extra)}
.tag.b{background:var(--book-soft);color:var(--book)}
.tag.k{background:var(--accent-soft);color:var(--accent)}
.sec{margin-top:48px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px;scroll-margin-top:120px}
.sec h2{font-size:26px}
.sec span{color:var(--muted);font-size:14px}
.slide{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;padding-block:22px;border-bottom:1px solid var(--line);scroll-margin-top:120px}
.slide .thumb img{width:100%;border-radius:6px;border:1px solid var(--line);display:block;background:#fff}
.slide .thumb{position:sticky;top:118px;align-self:start}
.head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.num{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--accent);font-weight:500;letter-spacing:.03em}
.num em{font-style:normal;color:var(--muted)}
.head h3{font-size:20px;margin-top:2px}
.copy{flex:none;font:500 13px "IBM Plex Sans",system-ui,sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
.copy:hover{border-color:var(--accent);color:var(--accent)}
.copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.copy.ok{background:var(--accent);border-color:var(--accent);color:#fff}
.notes{max-width:72ch}
.notes p{margin:10px 0 0}
.notes ul,.notes ol{margin:8px 0 0;padding-left:22px}
.notes li{margin:3px 0}
.notes li::marker{color:var(--muted)}
.box{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:14.8px}
.box > b:first-child{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.box p:first-of-type{margin-top:2px}
.box.w{background:var(--warn-soft)} .box.w > b:first-child{color:var(--warn)}
.box.x{background:var(--extra-soft)} .box.x > b:first-child{color:var(--extra)}
.box.k{background:var(--accent-soft)}
.box.b{background:var(--book-soft)} .box.b > b:first-child{color:var(--book)} .box.k > b:first-child{color:var(--accent)}
.f{font-family:"IBM Plex Mono",monospace;font-size:14px;display:block;margin:8px 0 0;padding:8px 12px;background:var(--code);border-radius:6px;overflow-x:auto;white-space:nowrap}
.slide.div{grid-template-columns:minmax(0,160px) minmax(0,1fr);padding-block:14px}
.slide.div .thumb{position:static}
.slide.div h3{font-size:17px}
.slide.nothumb{grid-template-columns:1fr}
.slide.nothumb .notes{max-width:80ch}
.slide.div .notes p{color:var(--muted);margin-top:4px}
.guide{margin-top:18px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.card h3{font-size:19px}
.card .meta{color:var(--muted);font-size:13.5px;margin-top:2px}
.card ul,.card ol{padding-left:22px;margin:10px 0 0}
.card li{margin:5px 0}
.qa{display:grid;gap:10px;margin-top:10px}
.qa details{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--surface)}
.qa summary{cursor:pointer;font-weight:500}
.qa details p{margin:8px 0 2px;color:var(--muted)}
figure{margin:14px 0 0}
figure img{width:100%;border-radius:6px;border:1px solid var(--line);background:#fff}
figcaption{font-size:13.5px;color:var(--muted);margin-top:6px}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
@media (max-width:760px){
  .slide,.slide.div{grid-template-columns:1fr;gap:12px}
  .slide .thumb{position:static}
  .slide.div .thumb{max-width:200px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
html{scroll-behavior:smooth}

/* dispensa */
.disp{max-width:74ch;margin-top:18px;font-size:16.5px;line-height:1.7}
.disp h3{font-size:22px;margin-top:30px}
.disp h4{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;font-weight:600;margin:22px 0 0}
.disp p{margin:12px 0 0}
.disp ul,.disp ol{margin:10px 0 0;padding-left:24px}
.disp li{margin:5px 0}
.disp .f{font-size:14.5px}
.disp figure{margin:16px 0 0}
.watch{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:16px;max-width:none}
.watch a{display:grid;gap:4px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.45}
.watch a:hover,.watch a:focus-visible{border-color:var(--accent);outline:none}
.watch .k{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.watch .d{color:var(--muted);font-size:13px}

.top{padding-block:8px 0}
.top .row1{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lessons{display:flex;gap:4px;flex-wrap:wrap}
.lessons a{color:#C9D3DA;text-decoration:none;font-size:13.5px;padding:4px 10px;border-radius:6px;font-variant-numeric:tabular-nums}
.lessons a[aria-current="page"]{background:#E9EEF1;color:#1C2630;font-weight:600}
.lessons a:hover:not([aria-current]),.lessons a:focus-visible{background:#35464E;color:#fff;outline:none}
.secnav{display:flex;gap:2px;overflow-x:auto;margin-top:6px;padding-bottom:8px;scrollbar-width:thin}
.secnav a{white-space:nowrap;color:#9FB0BB;text-decoration:none;font-size:13px;padding:3px 9px;border-radius:5px}
.secnav a:hover,.secnav a:focus-visible{background:#35464E;color:#fff;outline:none}
.secnav:empty{display:none}
.top nav.secnav{flex-wrap:nowrap}
.home-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:22px}
.lcard{display:grid;gap:6px;align-content:start;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.lcard:hover,.lcard:focus-visible{border-color:var(--accent);outline:none}
.lcard .n{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--accent)}
.lcard h3{font-size:19px}
.lcard p{margin:0;color:var(--muted);font-size:14px}
.lcard .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.loading{padding:60px 0;color:var(--muted)}

.slide .thumb img{cursor:zoom-in}
.lesson-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.btn-primary{font:600 14px "IBM Plex Sans",system-ui,sans-serif;background:var(--accent);color:#fff;border:0;border-radius:7px;padding:9px 16px;cursor:pointer}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.lesson-tools span{color:var(--muted);font-size:13.5px}
.ann-dot{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.04em}

/* presentazione: look unico scuro, indipendente dal tema */
.pv{position:fixed;inset:0;z-index:50;background:#12181C;color:#E6ECEF;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pv[hidden]{display:none!important}
.pv-bar{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding:8px 12px;background:#0B1013;border-bottom:1px solid #243038}
.pv-title{font:600 14px "IBM Plex Sans",system-ui,sans-serif;color:#C9D3DA;margin-right:6px;max-width:28ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-group{flex:none;display:flex;gap:4px;align-items:center;padding-right:8px;margin-right:4px;border-right:1px solid #243038}
.pv-group:last-child{border-right:0}
.pv-bar button,.pv-nav{font:500 13px "IBM Plex Sans",system-ui,sans-serif;color:#DCE4E9;background:#1C262D;border:1px solid #2C3A43;border-radius:6px;padding:5px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.pv-bar button:hover,.pv-nav:hover{background:#26333B}
.pv-bar button:focus-visible,.pv-nav:focus-visible{outline:2px solid #E8904F;outline-offset:1px}
.pv-bar button[aria-pressed="true"]{background:#E9EEF1;color:#12181C;border-color:#E9EEF1}
.pv-bar .sw{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid #2C3A43;padding:0;min-height:0;display:inline-block}
.pv-bar .sw[aria-pressed="true"]{outline:2px solid #fff;outline-offset:1px;border-color:transparent}
.pv-count{font:500 13px "IBM Plex Mono",monospace;color:#C9D3DA;min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
.pv-spacer{flex:1}
.pv-status{font-size:12px;color:#8FA0AB;white-space:nowrap}
.pv-main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
.pv.nonotes .pv-main{grid-template-columns:minmax(0,1fr)}
.pv.nonotes .pv-notes{display:none}
.pv-stage{position:relative;display:flex;align-items:center;justify-content:center;padding:14px;min-height:0;min-width:0;overflow:hidden}
.pv-frame{position:relative;background:#fff;box-shadow:0 6px 30px rgba(0,0,0,.45);line-height:0}
.pv-frame img{display:block;width:100%;height:100%;max-width:none;user-select:none;-webkit-user-drag:none}
.pv-frame canvas{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply}
.pv-frame.drawing canvas{touch-action:none;cursor:crosshair}
.pv-frame.erasing canvas{touch-action:none;cursor:cell}
.pv-frame:not(.drawing):not(.erasing) canvas{pointer-events:none}
.pv-empty{width:min(80%,640px);aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;border:1px dashed #3A4953;border-radius:8px;color:#8FA0AB;font-size:14px;line-height:1.5;text-align:center;padding:20px}
.pv-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border-radius:8px!important;opacity:.55;justify-content:center}
.pv-nav:hover{opacity:1}
.pv-nav.prev{left:6px}.pv-nav.next{right:6px}
.pv-notes{background:var(--surface);color:var(--ink);overflow-y:auto;padding:18px 20px 40px;border-left:1px solid #243038}
.pv-notes .slide{display:block;padding:0;border:0}
.pv-notes .notes{max-width:none}
.pv-notes .head h3{font-size:19px}
.pv-foot{display:flex;gap:10px;align-items:center;padding:6px 14px 8px;background:#0B1013;border-top:1px solid #243038}
.pv-foot input[type=range]{flex:1;accent-color:#E8904F}
.pv-foot .keys{font-size:12px;color:#7F909B;white-space:nowrap}
@media (max-width:900px){
  .pv-main{grid-template-columns:1fr;grid-template-rows:minmax(0,58%) minmax(0,42%)}
  .pv.nonotes .pv-main{grid-template-rows:1fr}
  .pv-notes{border-left:0;border-top:1px solid #243038}
  .pv-foot .keys{display:none}
  .pv-title{display:none}
}

.pv-bar > button{flex:none}
.pv-nav{position:absolute;display:flex;align-items:center;font:500 22px system-ui,sans-serif;color:#DCE4E9;background:#1C262D;border:1px solid #2C3A43;cursor:pointer}

/* ===== responsività: niente scroll orizzontale ===== */
html,body{overflow-x:hidden}
.wrap,#main{min-width:0;max-width:100%}
.slide{grid-template-columns:minmax(0,340px) minmax(0,1fr)}
.slide > *, .guide > *, .two > *, .howto > *, .home-grid > *, .watch > *, .notes, .body, .card, .disp{min-width:0}
.two{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.howto{grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr))}
.home-grid{grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr))}
.watch{grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
/* formule e codice vanno a capo invece di scorrere */
.f{white-space:normal;overflow-x:visible;overflow-wrap:anywhere;word-break:normal}
pre{white-space:pre-wrap;overflow-x:visible;overflow-wrap:anywhere}
code{overflow-wrap:anywhere}
.notes p,.notes li,.disp p,.disp li,.card p,.card li,figcaption{overflow-wrap:break-word}
img,svg,video,canvas{max-width:100%;height:auto}
.pv-frame img{height:100%}
.disp figure img{display:block;margin:0 auto;border-radius:6px}
/* menu: vanno a capo, niente barra orizzontale */
.top nav.secnav{flex-wrap:wrap;overflow-x:visible;gap:2px 4px}
.lessons{row-gap:2px}
.pv-bar{flex-wrap:wrap;overflow-x:visible;row-gap:6px}
@media (max-width:760px){
  .top{position:static}
  .slide .thumb{position:static}
  .slide,.slide.div{grid-template-columns:minmax(0,1fr)}
  .sec{scroll-margin-top:12px}
  .slide{scroll-margin-top:12px}
  .lessons a,.top nav.secnav a{font-size:12.5px;padding:3px 7px}
  .top .row1{gap:6px}
  header.hero{padding-block:22px 4px}
  .disp{font-size:16px}
  .disp h3{font-size:20px}
  .howto{padding:16px}
  .card{padding:14px 15px}
  .pv-bar{padding:6px 8px;gap:6px}
  .pv-group{padding-right:6px;margin-right:0;border-right:0}
  .pv-bar button{padding:4px 8px;font-size:12.5px;min-height:30px}
  .pv-notes{padding:14px 14px 30px}
}
@media (min-width:761px) and (max-width:1100px){
  .slide{grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px}
}

/* ===== evidenziatore di testo ===== */
mark.hl{color:#1C2630;border-radius:2px;padding:0 1px;box-decoration-break:clone;-webkit-box-decoration-break:clone;cursor:pointer}
mark.hl-y{background:#FFE34D}
mark.hl-g{background:#A8E6A1}
mark.hl-p{background:#FFB8D9}
mark.hl-u{background:transparent;color:inherit;text-decoration:underline;text-decoration-color:#D32F2F;text-decoration-thickness:2px;text-underline-offset:3px}
.hl-bar{position:fixed;z-index:80;display:flex;gap:6px;align-items:center;padding:6px 8px;background:#12181C;border:1px solid #2C3A43;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.hl-bar[hidden]{display:none!important}
.hl-bar button{width:30px;height:30px;border-radius:50%;border:2px solid #2C3A43;cursor:pointer;padding:0;font:700 13px "IBM Plex Sans",system-ui,sans-serif;color:#1C2630}
.hl-bar button:focus-visible{outline:2px solid #E8904F;outline-offset:2px}
.hl-sw-y{background:#FFE34D}.hl-sw-g{background:#A8E6A1}.hl-sw-p{background:#FFB8D9}
.hl-sw-u{background:#E9EEF1;text-decoration:underline;text-decoration-color:#D32F2F;text-decoration-thickness:2px}
.hl-bar .hl-del{width:auto;border-radius:6px;padding:0 10px;background:#E9EEF1}
.hl-tip{color:var(--muted);font-size:13.5px}
.pv{max-width:100vw;overflow:hidden}
.pv-main > *{min-width:0}
@media (max-width:900px){ .pv-main{grid-template-columns:minmax(0,1fr)} }
.pv{grid-template-columns:minmax(0,1fr)} .pv > *{min-width:0}

/* ===== presentazione della dispensa ===== */
.dr .pv-bar{position:relative;z-index:2}
.dr-stage{position:relative;overflow-y:auto;overflow-x:hidden;min-height:0;background:#12181C;-webkit-overflow-scrolling:touch}
.dr-paper{position:absolute;top:12px;transform-origin:0 0;background:#FFFFFF;border-radius:6px;box-shadow:0 6px 30px rgba(0,0,0,.45);
  --ink:#1C2630;--muted:#5B6773;--surface:#FFFFFF;--line:#DCE1E6;--code:#EEF1F4;--accent:#B8581A;--accent-soft:#FBEFE5;--warn:#A3261E;--warn-soft:#FBEAE8;--extra:#2F5E7A;--extra-soft:#E8F1F6;--book:#3D6B3A;--book-soft:#EAF2E6;
  color:var(--ink);color-scheme:light}
.dr-content{padding:34px 40px 30px;max-width:none!important;margin:0!important}
.dr-content.disp{font-size:17px}
.dr-kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:6px}
.dr-content > h3:first-of-type{margin-top:4px;font-size:26px}
.dr-paper canvas{position:absolute;left:0;top:0;mix-blend-mode:multiply;pointer-events:none}
.dr-paper.drawing canvas{pointer-events:auto;touch-action:none;cursor:crosshair}
.dr-paper.erasing canvas{pointer-events:auto;touch-action:none;cursor:cell}
.dr-sizer{pointer-events:none}
.dr .watch{grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
@media (max-width:700px){ .dr-content{padding:22px 18px 20px} .dr-content.disp{font-size:16px} }
.btn-sm{font-size:13px;padding:6px 12px;margin-left:auto}
.sec .btn-sm{align-self:center}

/* dispensa centrata, non tutta a sinistra */
.disp{margin-inline:auto;max-width:80ch}
.disp figure{margin-inline:0}
header.hero{text-align:left}

.disp{max-width:860px}
.sec:has(+ .disp){max-width:860px;margin-inline:auto}
#main.dview{max-width:880px;margin-inline:auto}

<script>
(function(){
  function cleanClone(slide){
    var src = slide.querySelector('.notes .body');
    var title = slide.querySelector('h3').textContent;
    var num = slide.getAttribute('data-n');
    var c = src.cloneNode(true);
    c.querySelectorAll('.f').forEach(function(f){
      var p = document.createElement('p');
      p.style.fontFamily = 'Consolas, monospace';
      p.innerHTML = f.innerHTML; f.replaceWith(p);
    });
    c.querySelectorAll('.box').forEach(function(b){
      var d = document.createElement('div');
      var lab = b.querySelector(':scope > b');
      var p = document.createElement('p');
      p.innerHTML = '<b>' + (lab ? lab.textContent : '') + '</b>';
      d.appendChild(p);
      if (lab) lab.remove();
      while (b.firstChild) d.appendChild(b.firstChild);
      b.replaceWith(d);
    });
    var html = '<h3>Slide ' + num + ' · ' + title + '</h3>' + c.innerHTML;
    return {html: html, text: 'Slide ' + num + ' - ' + title + '\n\n' + c.innerText};
  }
  function flash(btn, msg){
    var old = btn.textContent; btn.textContent = msg; btn.classList.add('ok');
    setTimeout(function(){ btn.textContent = old; btn.classList.remove('ok'); }, 1400);
  }
  function fallback(slide, btn){
    var body = slide.querySelector('.notes .body');
    var r = document.createRange(); r.selectNodeContents(body);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    var ok = false; try { ok = document.execCommand('copy'); } catch(e) {}
    flash(btn, ok ? 'Copiato' : 'Selezionato: premi Cmd+C');
  }
  document.addEventListener('click', function(e){
    var btn = e.target.closest('.copy'); if (!btn) return;
    var slide = btn.closest('.slide');
    var d = cleanClone(slide);
    try {
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
        navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([d.html], {type:'text/html'}),
          'text/plain': new Blob([d.text], {type:'text/plain'})
        })]).then(function(){ flash(btn, 'Copiato'); }, function(){ fallback(slide, btn); });
      } else { fallback(slide, btn); }
    } catch(err) { fallback(slide, btn); }
  });
})();
</script>
<script>(function(){

  function lsSet(L,n,v){ try { if (v && v.strokes.length) localStorage.setItem(lsKey(L,n), JSON.stringify(v)); else localStorage.removeItem(lsKey(L,n)); } catch(e){} }
  function col(){ return store.db.collection('data/users/' + store.uid); }

  function setStatus(msg){
    var el = document.getElementById('pv-status'); if (!el) return;
    el.textContent = msg || (store.db ? 'Annotazioni salvate nel tuo account' : 'Annotazioni salvate solo in questo browser');
  }

  function loadLocal(L){
    if (annLoaded[L]) return; annLoaded[L] = true; ann[L] = ann[L] || {};

  function loadCloud(L){
    col().where('lesson','==',L).get().then(function(snap){
      snap.docs.forEach(function(d){
        var b = d.data(); if (!b || b.kind) return;
        var loc = ann[L][b.n];
        if (!loc || (b.updated||0) >= (loc.updated||0)) { ann[L][b.n] = {strokes: b.strokes||[], updated: b.updated||0}; lsSet(L,b.n,ann[L][b.n]); }
      });
      // annotazioni fatte offline più recenti del cloud: le carico su
      Object.keys(ann[L]).forEach(function(n){
        var inCloud = snap.docs.some(function(d){ return d.data() && !d.data().kind && d.data().n == n && (d.data().updated||0) >= (ann[L][n].updated||0); });
        if (!inCloud && ann[L][n].strokes.length) queueCloud(L, +n);

    setStatus('Salvataggio…');
    saveChains[key] = (saveChains[key] || Promise.resolve()).then(function(){
      var ref = col().doc(id);

    }).then(function(){ setStatus(); }, function(e){

    });

      document.querySelectorAll('#main .disp[data-hl]').forEach(function(d){
        var L = d.getAttribute('data-hl').split('-')[0], sec = d.previousElementSibling;
        while (sec && !sec.classList.contains('sec')) sec = sec.previousElementSibling;
        if (sec && !sec.querySelector('[data-present-disp]')) {
          var b = document.createElement('button'); b.type = 'button'; b.className = 'btn-primary btn-sm'; b.setAttribute('data-present-disp', L); b.textContent = 'Presenta la dispensa';
          sec.appendChild(b);
          var bv = document.createElement('button'); bv.type = 'button'; bv.className = 'btn-primary btn-sm btn-ghost'; bv.setAttribute('data-present-disp', L); bv.setAttribute('data-video', '1'); bv.textContent = 'Guarda la videolezione';
          sec.appendChild(bv);
        }
      });
      var tools = document.querySelector('#main .lesson-tools');
      if (tools && !tools.querySelector('[data-present-disp]') && document.querySelector('#main .disp[data-hl]')) {
        var b2 = document.createElement('button'); b2.type = 'button'; b2.className = 'btn-primary'; b2.setAttribute('data-present-disp', '');
        b2.textContent = 'Presenta la dispensa'; tools.insertBefore(b2, tools.children[1] || null);
        var b3 = document.createElement('button'); b3.type = 'button'; b3.className = 'btn-primary btn-ghost'; b3.setAttribute('data-present-disp', ''); b3.setAttribute('data-fs', '1');
        b3.textContent = 'Dispensa a schermo intero'; tools.insertBefore(b3, b2.nextSibling);
        var b4 = document.createElement('button'); b4.type = 'button'; b4.className = 'btn-primary btn-ghost'; b4.setAttribute('data-present-disp', ''); b4.setAttribute('data-video', '1');
        b4.textContent = 'Videolezione'; tools.insertBefore(b4, b3.nextSibling);
      }
      var hero = document.querySelector('#main header.hero');
      if (hero && location.hash === '#dispensa' && !hero.querySelector('[data-present-disp]')) {
        var d3 = document.createElement('div'); d3.className = 'lesson-tools';
        d3.innerHTML = '<button type="button" class="btn-primary" data-present-disp="">Presenta la dispensa</button><button type="button" class="btn-primary btn-ghost" data-present-disp="" data-fs="1">Schermo intero</button><button type="button" class="btn-primary btn-ghost" data-present-disp="" data-video="1">Videolezione</button><span>Una sezione per pagina, a tutto schermo, con penna, evidenziatore e sottolineatura. Puoi anche selezionare il testo per evidenziarlo.</span>';
        hero.appendChild(d3);
        var ch = document.createElement('div'); ch.className = 'lesson-tools dr-vchips';
        var Ls = []; document.querySelectorAll('#main .disp[data-hl]').forEach(function(d){ Ls.push(d.getAttribute('data-hl').split('-')[0]); });
        ch.innerHTML = '<span>Videolezione di:</span>' + Ls.map(function(L){ var info = (window.LESSONS||[]).filter(function(x){ return x.id === L; })[0]; return '<button type="button" class="btn-primary btn-sm btn-ghost" data-present-disp="' + L + '" data-video="1" title="' + (info ? info.h1.replace(/"/g, '') : L) + '">' + (info ? 'L' + info.num : L) + '</button>'; }).join('');
        hero.appendChild(ch);
      }
    },
    close: close
  };
})();
</script>
</html>
